name: Release PlayStoreDetach

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build & release (skip version check)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-playstoredetach
  cancel-in-progress: false

jobs:
  # ==========================================================
  # JOB 1: Detect version and decide whether to release
  # ==========================================================
  prepare:
    name: Detect Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      date: ${{ steps.ver.outputs.date }}
      should_release: ${{ steps.check.outputs.should_release }}
      changelog: ${{ steps.log.outputs.changelog }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and date
        id: ver
        run: |
          # Version source priority:
          # 1. Pushed tag (refs/tags/v1.0.0)  2. module.prop
          SOURCE="module.prop"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
            SOURCE="git tag"
          else
            RAW=$(grep '^version=' module/module.prop | head -1 | \
                  cut -d'=' -f2 | tr -d '\r' | sed 's/^[vV]//' | sed 's/[[:space:]]//g')
          fi

          echo "Raw version from $SOURCE: '$RAW'"

          # Accept x, x.y, or x.y.z (digits only)
          if ! [[ "$RAW" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid version '$RAW' (from $SOURCE). Expected: x, x.y, or x.y.z (e.g. 1.0.0)"
            exit 1
          fi

          # AUTO-NORMALIZE: "1" -> "1.0.0", "1.0" -> "1.0.0"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VERSION="$MAJOR.$MINOR.$PATCH"

          # versionCode: 1.0.0 -> 10000 | 2.1.0 -> 20100
          VC=$((MAJOR*10000 + MINOR*100 + PATCH))

          # Date format: dd-mm-yyyy (WIB timezone)
          DATE=$(TZ='Asia/Jakarta' date +'%d-%m-%Y')

          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "version_code=$VC"     >> "$GITHUB_OUTPUT"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"

          echo "Version     : v$VERSION (versionCode: $VC) [source: $SOURCE]"
          echo "Release date: $DATE"

      - name: Check tag and release (prevent duplicate releases)
        id: check
        run: |
          TAG="v${{ steps.ver.outputs.version }}"

          TAG_EXISTS="no"
          git rev-parse "$TAG" >/dev/null 2>&1 && TAG_EXISTS="yes"

          RELEASE_EXISTS="no"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          [ "$HTTP" = "200" ] && RELEASE_EXISTS="yes"

          echo "Tag $TAG exists?     : $TAG_EXISTS"
          echo "Release $TAG exists? : $RELEASE_EXISTS"

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force mode -> PROCEED"; RESULT="true"
          elif [ "$TAG_EXISTS" = "yes" ] && [ "$RELEASE_EXISTS" = "yes" ]; then
            echo "Already released -> SKIP"; RESULT="false"
          else
            echo "New version -> PROCEED"; RESULT="true"
          fi
          echo "should_release=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: log
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            LOG=$(git log "$LAST_TAG..HEAD" --pretty=format:'- %s' --no-merges | head -50)
          else
            LOG=$(git log --pretty=format:'- %s' --no-merges | head -50)
          fi
          [ -z "$LOG" ] && LOG="- Release v${{ steps.ver.outputs.version }}"

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # ==========================================================
  # JOB 2: Build all 4 architectures + package
  # ==========================================================
  build:
    name: Build Module
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/android-ndk
          key: android-ndk-r26d

      - name: Download NDK r26d
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          NDK_DIR="${{ runner.tool_cache }}/android-ndk"
          wget -q "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp
          mv /tmp/android-ndk-* "$NDK_DIR"

      - name: Build all architectures
        run: |
          export ANDROID_NDK="${{ runner.tool_cache }}/android-ndk"
          VERSION="${{ needs.prepare.outputs.version }}"
          VC="${{ needs.prepare.outputs.version_code }}"
          DATE="${{ needs.prepare.outputs.date }}"

          # Inject final version and release date into module.prop
          sed -i "s/^version=.*/version=v${VERSION}/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${VC}/" module/module.prop
          sed -i "s|^description=.*|description=Universal Play Store Detach - Android 7-17+ \| Released ${DATE}|" module/module.prop

          echo "--- final module.prop ---"
          cat module/module.prop

          mkdir -p build
          for ARCH in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "=== Building $ARCH ==="
            cmake -B "build/$ARCH" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ARCH" \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -G Ninja
            ninja -C "build/$ARCH"
          done
          echo "All 4 architectures built successfully"

          - name: Package module (files at zip ROOT)
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          DATE="${{ needs.prepare.outputs.date }}"
          ZIP="PlayStoreDetach-v${VERSION}-${DATE}.zip"

          # ========================================================
          # FIX: pastikan folder output ada SEBELUM cd ke sana
          # ========================================================
          mkdir -p output
          cd output

          rm -rf PlayStoreDetach "$ZIP" "${ZIP}.sha256"
          mkdir -p PlayStoreDetach/zygisk/{arm64-v8a,armeabi-v7a,x86_64,x86}
          mkdir -p PlayStoreDetach/META-INF/com/google/android

          # Copy module files
          cp -r ../module/* PlayStoreDetach/

          # Copy native libraries
          cp ../build/arm64-v8a/libzygisk-detach.so    PlayStoreDetach/zygisk/arm64-v8a/
          cp ../build/armeabi-v7a/libzygisk-detach.so  PlayStoreDetach/zygisk/armeabi-v7a/
          cp ../build/x86_64/libzygisk-detach.so       PlayStoreDetach/zygisk/x86_64/
          cp ../build/x86/libzygisk-detach.so          PlayStoreDetach/zygisk/x86/

          # Generate recovery installer files (inline)
          echo "#MAGISK" > PlayStoreDetach/META-INF/com/google/android/updater-script

          cat > PlayStoreDetach/META-INF/com/google/android/update-binary <<'BINARY_EOF'
          #!/sbin/sh
          umask 022
          ui_print() { echo "$1"; }
          require_new_magisk() {
            ui_print "*******************************"
            ui_print " Please install Magisk v20.4+! "
            ui_print "*******************************"
            exit 1
          }
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          [ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk
          . /data/adb/magisk/util_functions.sh
          [ $MAGISK_VER_CODE -lt 20400 ] && require_new_magisk
          install_module
          exit 0
          BINARY_EOF

          # Fix permissions
          chmod 0755 PlayStoreDetach/*.sh 2>/dev/null || true
          chmod 0755 PlayStoreDetach/META-INF/com/google/android/update-binary

          # ========================================================
          # KEY: zip dari DALAM folder pakai "."
          # → module.prop berada di ROOT zip (yang diminta KSU/Magisk)
          # ========================================================
          cd PlayStoreDetach
          zip -r9 "../$ZIP" .
          cd ..

          sha256sum "$ZIP" > "${ZIP}.sha256"

          # Verifikasi struktur
          echo "================ ZIP STRUCTURE ================"
          unzip -l "$ZIP"
          echo "================================================"

          if ! unzip -l "$ZIP" | grep -q " module.prop$"; then
            echo "::error::module.prop not found at zip root! Packaging failed."
            exit 1
          fi
          echo "Structure check PASSED: module.prop is at zip root"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-build
          path: |
            output/*.zip
            output/*.sha256
          retention-days: 7

  # ==========================================================
  # JOB 3: Create tag + GitHub Release
  # ==========================================================
  release:
    name: Publish Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: module-build
          path: artifact/

      - name: Generate update.json (Magisk auto-update)
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VC="${{ needs.prepare.outputs.version_code }}"
          DATE="${{ needs.prepare.outputs.date }}"
          ZIP="PlayStoreDetach-v${VERSION}-${DATE}.zip"
          REPO="${{ github.repository }}"

          cat > artifact/update.json <<EOF
          {
            "version": "v${VERSION}",
            "versionCode": ${VC},
            "zipUrl": "https://github.com/${REPO}/releases/latest/download/${ZIP}",
            "changelog": "https://github.com/${REPO}/releases/latest"
          }
          EOF
          cat artifact/update.json

      - name: Create tag if not exists
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG created"
          else
            echo "Tag $TAG already exists"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: PlayStoreDetach v${{ needs.prepare.outputs.version }} - ${{ needs.prepare.outputs.date }}
          body: |
            # PlayStoreDetach v${{ needs.prepare.outputs.version }}

            **Release Date:** ${{ needs.prepare.outputs.date }}

            ## Changes
            ${{ needs.prepare.outputs.changelog }}

            ## Compatibility
            | | |
            |---|---|
            | Android | 7.0 - 17+ (API 24-37+) |
            | OEM | miui/hyperos, OneUI, ColorOS, OriginOS, EMUI, and more |
            | Root | Magisk (Zygisk) / KernelSU / APatch (with ReZygisk) |
            | Architecture | arm64-v8a, armeabi-v7a, x86_64, x86 |

            ## Installation
            1. Download `PlayStoreDetach-v${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.date }}.zip`
            2. Install via Magisk / KernelSU / APatch
            3. **KernelSU/APatch:** make sure ReZygisk is installed first
            4. Reboot
            5. Manage detach list via WebUI in the manager app

            > Verify file integrity with the `.sha256` file
          files: |
            artifact/PlayStoreDetach-v*
            artifact/update.json
          make_latest: true
