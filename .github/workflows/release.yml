name: Release PlaystoreDetach

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build & release (skip version check)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-playstoredetach
  cancel-in-progress: false

jobs:
  # ==========================================================
  # JOB 1: Detect version and decide whether to release
  # ==========================================================
  prepare:
    name: Detect Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      date: ${{ steps.ver.outputs.date }}
      should_release: ${{ steps.check.outputs.should_release }}
      changelog: ${{ steps.log.outputs.changelog }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-detect version (no manual edit needed)
        id: ver
        run: |
          # MAJOR.MINOR hanya diambil dari module.prop (edit manual cuma perlu
          # kalau memang mau naik versi besar/fitur baru). PATCH dihitung
          # otomatis dari jumlah tag rilis yang sudah ada untuk MAJOR.MINOR
          # tsb, jadi module.prop TIDAK PERNAH perlu diubah manual per rilis.
          RAW=$(grep '^version=' module/module.prop | head -1 | \
                cut -d'=' -f2 | tr -d '\r' | sed 's/^[vV]//' | sed 's/[[:space:]]//g')

          if ! [[ "$RAW" =~ ^[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid version '$RAW' in module.prop. Expected: x.y or x.y.z"
            exit 1
          fi

          MAJOR=$(echo "$RAW" | cut -d'.' -f1)
          MINOR=$(echo "$RAW" | cut -d'.' -f2)

          git fetch --tags --quiet
          EXISTING=$(git tag -l "v${MAJOR}.${MINOR}.*" | wc -l)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Manual tag push -> pakai apa adanya, jangan auto-increment lagi
            VERSION="${GITHUB_REF#refs/tags/v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          else
            PATCH=$EXISTING
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          VC=$((MAJOR*10000 + MINOR*100 + PATCH))
          DATE=$(TZ='Asia/Jakarta' date +'%d-%m-%Y')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          echo "Version     : v$VERSION (versionCode: $VC) [auto patch: $PATCH]"
          echo "Release date: $DATE"

      - name: Check tag and release (prevent duplicates)
        id: check
        run: |
          TAG="v${{ steps.ver.outputs.version }}"

          TAG_EXISTS="no"
          git rev-parse "$TAG" >/dev/null 2>&1 && TAG_EXISTS="yes"

          RELEASE_EXISTS="no"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          [ "$HTTP" = "200" ] && RELEASE_EXISTS="yes"

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            RESULT="true"
          elif [ "$TAG_EXISTS" = "yes" ] && [ "$RELEASE_EXISTS" = "yes" ]; then
            RESULT="false"
          else
            RESULT="true"
          fi
          echo "should_release=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: log
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            LOG=$(git log "$LAST_TAG..HEAD" --pretty=format:'- %s' --no-merges | head -50)
          else
            LOG=$(git log --pretty=format:'- %s' --no-merges | head -50)
          fi
          [ -z "$LOG" ] && LOG="- Release v${{ steps.ver.outputs.version }}"

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # ==========================================================
  # JOB 2: Build all 4 architectures + package
  # ==========================================================
  build:
    name: Build Module
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/android-ndk
          key: android-ndk-r26d

      - name: Download NDK r26d
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          NDK_DIR="${{ runner.tool_cache }}/android-ndk"
          wget -q "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp
          mv /tmp/android-ndk-* "$NDK_DIR"

      - name: Build all architectures
        run: |
          export ANDROID_NDK="${{ runner.tool_cache }}/android-ndk"
          VERSION="${{ needs.prepare.outputs.version }}"
          VC="${{ needs.prepare.outputs.version_code }}"
          DATE="${{ needs.prepare.outputs.date }}"

          sed -i "s/^version=.*/version=v${VERSION}/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${VC}/" module/module.prop
          sed -i "s|^description=.*|description=Universal Play Store Detach - Android 7-17+ \| Released ${DATE}|" module/module.prop

          echo "--- final module.prop ---"
          cat module/module.prop

          mkdir -p build
          for ARCH in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "=== Building $ARCH ==="
            cmake -B "build/$ARCH" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ARCH" \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -G Ninja
            ninja -C "build/$ARCH"
          done
          echo "All 4 architectures built successfully"

      - name: Package module
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          DATE="${{ needs.prepare.outputs.date }}"
          ZIP="PlaystoreDetach-v${VERSION}-${DATE}.zip"

          mkdir -p output
          cd output

          rm -rf PlaystoreDetach "$ZIP" "${ZIP}.sha256"
          mkdir -p PlaystoreDetach/zygisk/arm64-v8a
          mkdir -p PlaystoreDetach/zygisk/armeabi-v7a
          mkdir -p PlaystoreDetach/zygisk/x86_64
          mkdir -p PlaystoreDetach/zygisk/x86
          mkdir -p PlaystoreDetach/META-INF/com/google/android

          cp -r ../module/* PlaystoreDetach/

          cp ../build/arm64-v8a/libzygisk-detach.so    PlaystoreDetach/zygisk/arm64-v8a/
          cp ../build/armeabi-v7a/libzygisk-detach.so  PlaystoreDetach/zygisk/armeabi-v7a/
          cp ../build/x86_64/libzygisk-detach.so       PlaystoreDetach/zygisk/x86_64/
          cp ../build/x86/libzygisk-detach.so          PlaystoreDetach/zygisk/x86/

          echo "#MAGISK" > PlaystoreDetach/META-INF/com/google/android/updater-script

          cat > PlaystoreDetach/META-INF/com/google/android/update-binary <<'BINARY_EOF'
          #!/sbin/sh
          umask 022
          ui_print() { echo "$1"; }
          require_new_magisk() {
            ui_print "*******************************"
            ui_print " Please install Magisk v20.4+! "
            ui_print "*******************************"
            exit 1
          }
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          [ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk
          . /data/adb/magisk/util_functions.sh
          [ $MAGISK_VER_CODE -lt 20400 ] && require_new_magisk
          install_module
          exit 0
          BINARY_EOF

          chmod 0755 PlaystoreDetach/*.sh 2>/dev/null || true
          chmod 0755 PlaystoreDetach/META-INF/com/google/android/update-binary

          cd PlaystoreDetach
          zip -r9 "../$ZIP" .
          cd ..

          sha256sum "$ZIP" > "${ZIP}.sha256"

          echo "================ ZIP STRUCTURE ================"
          unzip -l "$ZIP"
          echo "================================================"

          if ! unzip -l "$ZIP" | grep -q " module.prop$"; then
            echo "::error::module.prop not found at zip root!"
            exit 1
          fi
          echo "Structure check PASSED"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-build
          path: |
            output/*.zip
            output/*.sha256
          retention-days: 7

  # ==========================================================
  # JOB 3: Create tag + GitHub Release
  # ==========================================================
  release:
    name: Publish Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: module-build
          path: artifact/

      - name: Generate update.json
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VC="${{ needs.prepare.outputs.version_code }}"
          DATE="${{ needs.prepare.outputs.date }}"
          ZIP="PlaystoreDetach-v${VERSION}-${DATE}.zip"
          REPO="${{ github.repository }}"

          cat > artifact/update.json <<EOF
          {
            "version": "v${VERSION}",
            "versionCode": ${VC},
            "zipUrl": "https://github.com/${REPO}/releases/latest/download/${ZIP}",
            "changelog": "https://github.com/${REPO}/releases/latest"
          }
          EOF
          cat artifact/update.json

      - name: Create tag if not exists
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG created"
          else
            echo "Tag $TAG already exists"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: PlaystoreDetach v${{ needs.prepare.outputs.version }} - ${{ needs.prepare.outputs.date }}
          body: |
            # PlaystoreDetach v${{ needs.prepare.outputs.version }}

            **Release Date:** ${{ needs.prepare.outputs.date }}

            ## Changes
            ${{ needs.prepare.outputs.changelog }}

            ## Compatibility
            | | |
            |---|---|
            | Android | 7.0 - 17+ (API 24-37+) |
            | OEM | miui/hyperos, OneUI, ColorOS, OriginOS, EMUI, and more |
            | Root | Magisk (Zygisk) / KernelSU / APatch (with ReZygisk) |
            | Architecture | arm64-v8a, armeabi-v7a, x86_64, x86 |

            ## Installation
            1. Download the module zip file below
            2. Install via Magisk / KernelSU / APatch
            3. **KernelSU/APatch:** make sure ReZygisk is installed first
            4. Reboot
            5. Manage detach list via WebUI in the manager app

            > Verify file integrity with the .sha256 file
          files: |
            artifact/PlaystoreDetach-v*
            artifact/update.json
          make_latest: true
